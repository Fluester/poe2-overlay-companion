name: Build & Release PoE 2 Overlay Companion

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check XAML Localization & Scan Secrets
        shell: pwsh
        run: |
          $errors = @()
          foreach ($xaml in Get-ChildItem -Path . -Filter *.xaml -File) {
            $base = [System.IO.Path]::GetFileNameWithoutExtension($xaml.Name)
            $codeBehind = (Get-ChildItem -Path . -Filter "$base*.cs" -File | ForEach-Object {
              [System.IO.File]::ReadAllText($_.FullName, [System.Text.Encoding]::UTF8)
            }) -join "`n"
            $raw = [System.IO.File]::ReadAllText($xaml.FullName, [System.Text.Encoding]::UTF8)
            $noComments = [regex]::Replace($raw, '<!--[\s\S]*?-->', '')
            $tags = [regex]::Matches($noComments, '<[A-Za-z0-9_.:]+\b[^>]*?(?:Text|Content|Header|ToolTip|Title)="[^"]*[\u0400-\u04FF][^"]*"[^>]*>')
            foreach ($t in $tags) {
              $nm = [regex]::Match($t.Value, 'x:Name="([^"]+)"')
              if (-not $nm.Success) {
                $errors += "Unnamed Cyrillic tag in $($xaml.Name): $($t.Value)"
              } elseif ($codeBehind -notmatch "\b$([regex]::Escape($nm.Groups[1].Value))\b") {
                $errors += "Unlocalized x:Name '$($nm.Groups[1].Value)' in $($xaml.Name)"
              }
            }
          }
          $scanExts = @('.cs', '.xaml', '.yml', '.json', '.iss', '.md')
          $secretRx = @(
            'AIza[0-9A-Za-z\-_]{20,}',
            'sk-[A-Za-z0-9]{16,}',
            'POESESSID\s*=\s*[0-9a-f]{16,}'
          )
          $files = Get-ChildItem -Recurse -File | Where-Object {
            $scanExts -contains $_.Extension.ToLowerInvariant() -and
            $_.FullName -notmatch '[\\/](bin|obj|dist|\.git|Poe2OverlayCompanion\.Tests)[\\/]'
          }
          foreach ($f in $files) {
            $txt = [System.IO.File]::ReadAllText($f.FullName, [System.Text.Encoding]::UTF8)
            foreach ($rx in $secretRx) {
              if ($txt -match $rx) {
                $errors += "Secret pattern '$rx' matched in $($f.Name)"
              }
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "XAML localization audit & secret scan passed."

      - name: Restore & Build (Release)
        run: dotnet build Poe2OverlayCompanion.csproj -c Release

      - name: Run Offline Unit & Hygiene Tests
        run: dotnet test Poe2OverlayCompanion.Tests/Poe2OverlayCompanion.Tests.csproj -c Release --filter "Category!=Live" --verbosity normal

      - name: Publish Standalone Single-File EXE
        run: dotnet publish Poe2OverlayCompanion.csproj -c Release -r win-x64 --self-contained false -p:DebugType=none -p:AllowedReferenceRelatedFileExtensions=none -o dist

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer\Poe2OverlaySetup.iss

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          $ver = ([xml](Get-Content Poe2OverlayCompanion.csproj)).Project.PropertyGroup.Version
          New-Item -ItemType Directory -Force -Path dist/portable | Out-Null
          Copy-Item dist/Poe2OverlayCompanion.exe dist/portable/Poe2OverlayCompanion.exe
          "" | Set-Content dist/portable/portable.mode -Encoding ASCII
          "Portable Mode enabled: config and builds are stored in .\Data\ next to Poe2OverlayCompanion.exe" | Set-Content dist/portable/README_PORTABLE.txt -Encoding UTF8
          Compress-Archive -Path dist/portable/* -DestinationPath "dist/Poe2OverlayCompanion_Portable_v$ver.zip" -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Poe2OverlayCompanion-win-x64
          path: |
            dist/Poe2OverlayCompanion.exe
            dist/Poe2OverlayCompanion_Portable_v*.zip
            dist/Poe2OverlayCompanion_Setup_*.exe

      - name: Extract Release Notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $raw = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          if ($raw -match '(?ms)^##\s+v[^\r\n]+\r?\n(.+?)(?=^##\s+v|\z)') {
            $notes = $Matches[0].Trim()
          } else {
            $notes = (git log -1 --pretty=%B) -join "`n"
          }
          $notes | Set-Content dist/release_notes.md -Encoding UTF8

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release_notes.md
          generate_release_notes: false
          files: |
            dist/Poe2OverlayCompanion.exe
            dist/Poe2OverlayCompanion_Portable_v*.zip
            dist/Poe2OverlayCompanion_Setup_*.exe
