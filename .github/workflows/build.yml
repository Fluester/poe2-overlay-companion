name: Build & Release PoE 2 Overlay Companion

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Build (Release)
        run: dotnet build Poe2OverlayCompanion.csproj -c Release

      - name: Publish Standalone Single-File EXE
        run: dotnet publish Poe2OverlayCompanion.csproj -c Release -r win-x64 --self-contained false -o dist

      - name: Build Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer\Poe2OverlaySetup.iss

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/portable | Out-Null
          Copy-Item dist/Poe2OverlayCompanion.exe dist/portable/Poe2OverlayCompanion.exe
          "" | Set-Content dist/portable/portable.mode -Encoding ASCII
          "Portable Mode enabled: config and builds are stored in .\Data\ next to Poe2OverlayCompanion.exe" | Set-Content dist/portable/README_PORTABLE.txt -Encoding UTF8
          Compress-Archive -Path dist/portable/* -DestinationPath dist/Poe2OverlayCompanion_Portable_v1.1.0.zip -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Poe2OverlayCompanion-win-x64
          path: |
            dist/Poe2OverlayCompanion.exe
            dist/Poe2OverlayCompanion_Portable_v1.1.0.zip
            dist/Poe2OverlayCompanion_Setup_*.exe

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Poe2OverlayCompanion.exe
            dist/Poe2OverlayCompanion_Portable_v1.1.0.zip
            dist/Poe2OverlayCompanion_Setup_*.exe
